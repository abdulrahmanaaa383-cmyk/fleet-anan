.logo{width:38px;height:38px;border-radius:10px;background:var(--sig);color:var(--ink);display:grid;place-items:center}
nav a{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:12px;align-items:center;color:inherit;font-weight:500;text-decoration:none}
nav a:hover{background:var(--ink2);color:#fff}nav a.on{background:var(--ink3);color:#fff;box-shadow:inset 3px 0 0 var(--sig)}

nav .sp{flex:1}nav .sec{font-size:12px;color:#6f8ba0;margin:14px 12px 4px}
main{flex:1;padding:26px 30px;min-width:0;max-width:1400px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:24px;font-weight:700}

input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}

.acts{display:flex;gap:6px}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}.empty svg{opacity:.4;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#0c223399;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px}

.ft{display:flex;gap:8px;margin-top:20px}

.lw{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lb{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lb:after{content:"";position:absolute;inset-inline:0;bottom:90px;height:6px;background:repeating-linear-gradient(90deg,var(--sig) 0 46px,transparent 46px 92px);opacity:.9}
.lb h1{font-size:38px;line-height:1.25;margin:26px 0 12px;max-width:420px}.lb p{color:#9db6c8;max-width:400px;margin:0}
.lf{display:flex;align-items:center;justify-content:center;padding:30px;position:relative}.lf form{width:min(380px,100%)}.lf h2{margin:0 0 4px;font-size:24px}.lf p{color:var(--mu);margin:0 0 22px}
.lf label{font-size:12.5px;color:var(--mu);font-weight:600;display:block;margin-bottom:3px}.lf input{margin-bottom:14px}
.lg2{position:absolute;top:18px;inset-inline-end:18px}
.hist h4{margin:16px 0 6px}.hist li{font-size:14px;color:var(--mu)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.lw{grid-template-columns:1fr}.lb{display:none}}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.brand,.sp,.sec{display:none}nav a{white-space:nowrap}.fg{grid-template-columns:1fr}main{padding:16px}}
@media print{nav,.noprint{display:none!important}main{padding:0}body{background:#fff}.box,.card{box-shadow:none}}

function shell(h){
 const nav=[['dash','dash',t('dash')],...Object.entries(S).map(([k,s])=>[k,s.i,p(s.t)]),['report','chart',t('report')]];
 $('#root').innerHTML=`<div class="app"><nav><div class="brand"><div class="logo">${ic('car',22)}</div>${t('app')}</div>
 ${nav.map(([k,i,l])=>`<a data-p="${k}" tabindex=0 class="${page==k?'on':''}">${ic(i)}${l}</a>`).join('')}
 <div class="sp"></div><a id="lg">${ic('globe')}${lang=='ar'?'English':'العربية'}</a><a id="lo">${ic('out')}${t('logout')}</a></nav><main>${h}</main></div>`;
 document.querySelectorAll('nav a[data-p]').forEach(a=>a.onclick=()=>{page=a.dataset.p;render()});
 $('#lo').onclick=()=>db.auth.signOut();$('#lg').onclick=()=>setLang(lang=='ar'?'en':'ar');
}

function stats(m){
 const V=D.vehicles,w=V.filter(v=>v.status=='عاملة').length,inc=inM(D.incidents,m),inv=inM(D.invoices,m),fn=inM(D.fines,m),h=inM(D.handovers,m);
 return{total:V.length,work:w,stop:V.length-w,out:h.filter(x=>x.kind=='تسليم').length,inn:h.filter(x=>x.kind=='استلام').length,inc:inc.length,incCost:sum(inc,'repair_cost'),
 maint:sum(inv.filter(x=>['صيانة','قطع غيار','إطارات','زيوت','بطاريات'].includes(x.category)),'amount'),inv:sum(inv,'amount'),fines:fn.length,finesAmt:sum(fn,'amount'),
 util:V.length?Math.round(w/V.length*100):0,need:V.filter(v=>['في الصيانة','حادث'].includes(v.status)).length}
}
function kpi(i,l,v,tint,f){return `<div class="card k" style="--t:${tint};--f:${f}"><div class="ci">${ic(i,22)}</div><div><b>${v}</b><span>${l}</span></div></div>`}
function dash(){
 const m=new Date().toISOString().slice(0,7),s=stats(m),C=2*Math.PI*52,cols=['#0f8a64','#cf3a2e','#f5b301','#7d8fa0'];
 const cnt=ST.map(o=>D.vehicles.filter(v=>v.status==o.split('|')[0]).length);
 shell(`<div class="top"><h2>${t('dash')}</h2></div>
 <div class="hero"><div class="card ring"><svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="52" fill="none" stroke="#24506f" stroke-width="12"/><circle cx="62" cy="62" r="52" fill="none" stroke="#f5b301" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s.util/100)}" transform="rotate(-90 62 62)"/><text x="62" y="70" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${s.util}%</text></svg><div><small>${t('util')}</small><b>${s.work} / ${s.total}</b></div></div>
 <div class="card stat"><h4>${t('fleetStatus')}</h4><div class="bar">${cnt.map((c,i)=>c?`<i style="flex:${c};background:${cols[i]}"></i>`:'').join('')||''}</div><div class="lg">${ST.map((o,i)=>`<span style="--c:${cols[i]}">${p(o)}: <b>${cnt[i]}</b></span>`).join('')}</div></div></div>
 <div class="kpis">${kpi('car',t('total'),s.total,'#e6eef5','#24506f')}${kpi('alert',t('inc'),s.inc,'#fbe2df','#cf3a2e')}${kpi('wrench',t('incCost'),money(s.incCost),'#fdf3d8','#b7791f')}${kpi('receipt',t('inv'),money(s.inv),'#dcf3ea','#0f8a64')}${kpi('gauge',t('fines'),D.fines.filter(x=>x.status!='مسددة').length,'#fbe2df','#cf3a2e')}${kpi('users',t('auth'),D.drivers.filter(x=>x.auth_status!='تم التفويض').length,'#fdf3d8','#b7791f')}</div>
 <div class="top"><h2 style="font-size:18px">${t('open')}</h2></div>${tbl('incidents',D.incidents.filter(x=>x.status!='مغلق').slice(0,8),0)}`);
 hook('#root');
}

function tbl(k,rows,act=1){
 const s=S[k],F=Object.fromEntries(s.f.map(f=>[f[0],f]));F.plate=F.plate||['plate','','text'];
 if(!rows.length)return `<div class="box empty">${ic('inbox',40)}<div>${t('empty')}</div></div>`;
 return `<div class="box"><table><thead><tr>${s.c.map(c=>`<th>${p(L[c])}</th>`).join('')}${act?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.id}">${s.c.map((c,i)=>`<td>${cell(F[c],r[c],k,i==0)}</td>`).join('')}${act?`<td><div class="acts"><button class="btn ghost sm" data-e="${r.id}" title="${t('edit')}">${ic('edit',15)}</button><button class="btn red sm" data-d="${r.id}" title="${t('del')}">${ic('trash',15)}</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function hook(root,k){
 const r=$(root);
 r.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(k,D[k].find(x=>x.id==b.dataset.e)));
 r.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm(t('conf')))return;const{error}=await db.from(k).delete().eq('id',b.dataset.d);if(error)return toast(error.message);toast(t('deleted'));await load(k);list(k,$('#q')?.value)});
 r.querySelectorAll('[data-h]').forEach(a=>a.onclick=e=>{e.preventDefault();history(a.closest('tr').dataset.id)});
}
function list(k,q=''){
 const s=S[k];
 shell(`<div class="top"><h2>${p(s.t)}</h2><div class="sbox">${ic('search',16)}<input id="q" placeholder="${t('search')}" value="${esc(q)}"></div><button class="btn sig" id="add">${ic('plus',16)}${t('add')}</button></div><div id="tb"></div>`);
 const draw=()=>{const v=$('#q').value.trim().toLowerCase();
  $('#tb').innerHTML=tbl(k,D[k].filter(r=>!v||s.f.some(f=>String(f[2]=='ref'?nm(f[4],r[f[0]]):r[f[0]]??'').toLowerCase().includes(v))));hook('#tb',k)};
 $('#q').oninput=draw;$('#add').onclick=()=>form(k);draw();
}

function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${h}</div>`;o.onclick=e=>{if(e.target==o)o.remove()};document.body.append(o);return o}
function form(k,r={}){
 const s=S[k];
 const inp=f=>{const[key,lb,ty,req,o]=f,v=r[key]??'';let el;
  if(ty=='select')el=`<select id="f_${key}"><option value="">—</option>${o.map(x=>`<option value="${x.split('|')[0]}" ${x.split('|')[0]==v?'selected':''}>${p(x)}</option>`).join('')}</select>`;
  else if(ty=='ref')el=`<select id="f_${key}"><option value="">${t('choose')}</option>${D[o[0]].map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x[o[1]])}</option>`).join('')}</select>`;
  else if(ty=='area')el=`<textarea id="f_${key}" rows=2>${esc(v)}</textarea>`;
  else if(ty=='file')el=`<input id="f_${key}" type="file" accept="image/*,.pdf">${v?`<a href="${esc(v)}" target=_blank>${t('curFile')}</a>`:''}`;
  else el=`<input id="f_${key}" type="${ty}" value="${esc(v)}">`;
  return `<div class="${ty=='area'?'w':''}"><label>${p(lb)}${req?' *':''}</label>${el}</div>`};
 const o=modal(`<h3>${r.id?t('edit'):t('add')} — ${p(s.t)}</h3><div class="fg">${s.f.map(inp).join('')}</div><div class="ft"><button class="btn sig" id="sv">${t('save')}</button><button class="btn ghost" id="cx">${t('cancel')}</button></div>`);
 o.querySelector('#cx').onclick=()=>o.remove();
 o.querySelector('#sv').onclick=async e=>{
  const b=e.currentTarget;b.disabled=true;const row={};
  for(const f of s.f){const el=o.querySelector('#f_'+f[0]);let v=el.value;
   if(f[3]&&!v&&f[2]!='file'){b.disabled=false;return toast(t('req')+': '+p(f[1]))}
   if(f[2]=='file'){const file=el.files[0];if(!file)continue;
    const path=`${k}/${crypto.randomUUID()}_${file.name.replace(/[^\w.]/g,'_')}`;const u=await db.storage.from('docs').upload(path,file);
    if(u.error){b.disabled=false;return toast(u.error.message)}v=db.storage.from('docs').getPublicUrl(path).data.publicUrl}
   row[f[0]]=v===''?null:v}
  const{error}=r.id?await db.from(k).update(row).eq('id',r.id):await db.from(k).insert(row);
  if(error){b.disabled=false;return toast(error.code=='23505'?t('dup'):error.message)}
  o.remove();toast(t('saved'));await load(k);render();
 };
}

function history(id){
 const v=D.vehicles.find(x=>x.id==id),by=k=>D[k].filter(x=>x.vehicle_id==id),sv=x=>esc(p(V[x]||x||''));
 const ul=(k,fn)=>`<ul>${by(k).map(x=>`<li>${fn(x)}</li>`).join('')||`<li>${t('none')}</li>`}</ul>`;
 const tot=sum(by('invoices'),'amount')+sum(by('incidents'),'repair_cost')+sum(by('fines'),'amount');
 modal(`<h3>${t('file')}: <span class="plate">${esc(v.plate)}</span> ${esc(v.model)}</h3><div class="kpis">${kpi('receipt',t('totalCost'),money(tot),'#dcf3ea','#0f8a64')}${kpi('gauge',t('odo'),v.odometer??'—','#e6eef5','#24506f')}</div><div class="hist">
 <h4>${t('hs')}</h4>${ul('handovers',x=>`${x.date} — ${sv(x.kind)} — ${esc(nm(['drivers','name'],x.driver_id))}`)}
 <h4>${p(S.incidents.t)}</h4>${ul('incidents',x=>`${x.date} — ${sv(x.status)} — ${money(x.repair_cost)}`)}
 <h4>${p(S.invoices.t)}</h4>${ul('invoices',x=>`${x.date} — ${esc(x.supplier)} (${sv(x.category)}) — ${money(x.amount)}`)}
 <h4>${p(S.fines.t)}</h4>${ul('fines',x=>`${x.date} — ${money(x.amount)} — ${sv(x.status)}`)}</div>`);
}

function report(){
 const m=window._m||new Date().toISOString().slice(0,7),s=stats(m);
 const rows=[['r_total',s.total],['r_work',s.work],['r_stop',s.stop],['r_out',s.out],['r_in',s.inn],['r_inc',s.inc],['r_incc',money(s.incCost)],['r_maint',money(s.maint)],['r_inv',money(s.inv)],['r_fines',`${s.fines} (${money(s.finesAmt)})`],['r_need',s.need],['r_util',s.util+'%']];
 const pv=D.vehicles.map(v=>{const i=sum(inM(D.invoices,m).filter(x=>x.vehicle_id==v.id),'amount'),c=sum(inM(D.incidents,m).filter(x=>x.vehicle_id==v.id),'repair_cost'),f=sum(inM(D.fines,m).filter(x=>x.vehicle_id==v.id),'amount');return[v.plate,i,c,f,i+c+f]});
 shell(`<div class="top"><h2>${t('report')}</h2><input type="month" id="mm" value="${m}" style="width:170px" class="noprint"><button class="btn sig noprint" onclick="print()">${ic('print',16)}${t('print')}</button></div>
 <div class="box" style="margin-bottom:20px"><table><tbody>${rows.map(r=>`<tr><td>${t(r[0])}</td><td><b>${r[1]}</b></td></tr>`).join('')}</tbody></table></div>
 <div class="top"><h2 style="font-size:18px">${t('perCar')}</h2></div><div class="box"><table><thead><tr><th>${p(L.plate)}</th><th>${t('cInv')}</th><th>${t('cInc')}</th><th>${t('cFine')}</th><th>${t('cTot')}</th></tr></thead><tbody>${pv.map(r=>`<tr><td><span class="plate">${esc(r[0])}</span></td><td>${money(r[1])}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td><b>${money(r[4])}</b></td></tr>`).join('')}</tbody></table></div>`);
 $('#mm').onchange=e=>{window._m=e.target.value;report()};
}
function render(){page=='dash'?dash():page=='report'?report():list(page)}

function login(){
 $('#root').innerHTML=`<div class="lw"><div class="lb"><div class="brand"><div class="logo">${ic('car',22)}</div>${t('app')}</div><div><h1>${t('tag')}</h1><p>${t('tagSub')}</p></div><div></div></div>
 <div class="lf"><button class="btn ghost sm lg2" id="lg" type="button">${ic('globe',15)}${lang=='ar'?'English':'العربية'}</button>
 <form id="lf" autocomplete="on"><h2>${t('login')}</h2><p>${t('loginSub')}</p>
 <label for="em">${t('email')}</label><input id="em" name="email" type="email" autocomplete="username" dir="ltr" required>
 <label for="pw">${t('pass')}</label><input id="pw" name="password" type="password" autocomplete="current-password" dir="ltr" required>
 <button class="btn sig" id="go" type="submit" style="width:100%">${t('login')}</button></form></div></div>`;
 $('#lg').onclick=()=>setLang(lang=='ar'?'en':'ar');
 $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;
  const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;if(error)toast(t('bad'))};
}
db.auth.onAuthStateChange((ev,ses)=>{
 setTimeout(()=>{
  if(ses){if(user&&user.id==ses.user.id)return;user=ses.user;loadAll().then(render)}
  else{user=null;if(!$('#lf'))login()}
 },0)});
</script>
</body>
</html>
