<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anan Capital | إدارة الأسطول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#0c2233;--ink2:#17364d;--ink3:#24506f;--sig:#f15a22;--bg:#f1f4f7;--card:#fff;--tx:#12212d;--mu:#667a89;--ln:#e0e7ed;--ok:#0f8a64;--bad:#cf3a2e;--warn:#b7791f;--sh:0 1px 2px #0c223312,0 4px 14px #0c22330a}
*{box-sizing:border-box}body{margin:0;font:14.5px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ink3)}
svg{flex:none}
.app{display:flex;min-height:100vh}
nav{width:244px;background:var(--ink);color:#b9cddc;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;margin:0 6px 22px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--sig);color:var(--ink);display:grid;place-items:center}
nav a{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:12px;align-items:center;color:inherit;font-weight:500;text-decoration:none}
nav a:hover{background:var(--ink2);color:#fff}nav a.on{background:var(--ink3);color:#fff;box-shadow:inset 3px 0 0 var(--sig)}
[dir=rtl] nav a.on{box-shadow:inset -3px 0 0 var(--sig)}
nav .sp{flex:1}nav .sec{font-size:12px;color:#6f8ba0;margin:14px 12px 4px}
main{flex:1;padding:26px 30px;min-width:0;max-width:1400px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.top h2{margin:0;flex:1;font-size:24px;font-weight:700}
.btn{background:var(--ink);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.15)}.btn.sig{background:var(--sig);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ln)}.btn.red{background:#fff;color:var(--bad);border:1px solid #f1c9c5}.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--sig);outline-offset:1px;border-color:var(--sig)}
.sbox{position:relative;width:240px}.sbox svg{position:absolute;top:11px;inset-inline-start:11px;color:var(--mu)}.sbox input{padding-inline-start:36px}
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh)}
.ring{background:var(--ink);color:#fff;padding:22px;display:flex;gap:18px;align-items:center;border:0}
.ring small{color:#9db6c8;display:block}.ring b{font-size:15px}
.stat{padding:20px}.stat h4{margin:0 0 14px;font-size:15px}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--bg);gap:2px}.bar i{display:block}
.lg{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--mu);font-size:13px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.k{padding:16px;display:flex;gap:14px;align-items:center}.k .ci{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--t,#e6eef5);color:var(--f,var(--ink3))}
.k b{display:block;font-size:22px;line-height:1.2}.k span{color:var(--mu);font-size:13px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:#f7f9fb;color:var(--mu);font-weight:600;font-size:12.5px}tr:last-child td{border:0}tbody tr:hover td{background:#fafcfd}
.b{padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:#fdf3d8;color:var(--warn)}.b.g{background:#dcf3ea;color:var(--ok)}.b.r{background:#fbe2df;color:var(--bad)}
.plate{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:0 10px;font-weight:700;letter-spacing:.5px;background:#fff;color:var(--ink);text-decoration:none}
.acts{display:flex;gap:6px}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}.empty svg{opacity:.4;margin-bottom:6px}
.ov{position:fixed;inset:0;background:#0c223399;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px}
.md h3{margin:0 0 16px;font-size:19px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg label{font-size:12.5px;color:var(--mu);display:block;margin-bottom:3px;font-weight:600}.fg .w{grid-column:1/-1}
.ft{display:flex;gap:8px;margin-top:20px}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:99;box-shadow:var(--sh)}
.lw{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lb{background:var(--sig);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lb:after{content:"";position:absolute;inset-inline:0;bottom:90px;height:6px;background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px);opacity:.9}
.lb h1{font-size:38px;line-height:1.25;margin:26px 0 12px;max-width:420px}.lb p{color:#ffe9df;max-width:400px;margin:0}
.lf{display:flex;align-items:center;justify-content:center;padding:30px;position:relative}.lf form{width:min(380px,100%)}.lf h2{margin:0 0 4px;font-size:24px}.lf p{color:var(--mu);margin:0 0 22px}
.lf label{font-size:12.5px;color:var(--mu);font-weight:600;display:block;margin-bottom:3px}.lf input{margin-bottom:14px}
.lg2{position:absolute;top:18px;inset-inline-end:18px}
.hist h4{margin:16px 0 6px}.hist li{font-size:14px;color:var(--mu)}
.brandbox{background:var(--sig);border-radius:14px;padding:14px;margin:0 2px 16px;display:flex;justify-content:center}.brandbox img{height:40px}.lgbig{width:240px;max-width:70%}.who{margin:0 6px 14px;color:#fff;font-size:13.5px;font-weight:600}.who small{display:block;color:#8fb0c6;font-weight:400}.cf{margin:0 2px 14px;background:var(--ink2);color:#fff;border-color:var(--ink3);width:calc(100% - 4px)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.lw{grid-template-columns:1fr}.lb{display:none}}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.brand,.sp,.sec{display:none}nav a{white-space:nowrap}.fg{grid-template-columns:1fr}main{padding:16px}}
@media print{nav,.noprint{display:none!important}main{padding:0}body{background:#fff}.box,.card{box-shadow:none}}
</style>
</head>

function tbl(k,rows,act=1){

}

function form(k,r={}){

  if(ty=='select')el=`<select id="f_${key}"><option value="">—</option>${o.map(x=>`<option value="${x.split('|')[0]}" ${x.split('|')[0]==v?'selected':''}>${p(x)}</option>`).join('')}</select>`;

  else if(ty=='area')el=`<textarea id="f_${key}" rows=2>${esc(v)}</textarea>`;
  else if(ty=='file')el=`<input id="f_${key}" type="file" accept="image/*,.pdf">${v?`<a href="${esc(v)}" target=_blank>${t('curFile')}</a>`:''}`;
  else el=`<input id="f_${key}" type="${ty}" value="${esc(v)}">`;
  return `<div class="${ty=='area'?'w':''}"><label>${p(lb)}${req?' *':''}</label>${el}</div>`};
 const o=modal(`<h3>${r.id?t('edit'):t('add')} — ${p(s.t)}</h3><div class="fg">${fl(k).map(inp).join('')}</div><div class="ft"><button class="btn sig" id="sv">${t('save')}</button><button class="btn ghost" id="cx">${t('cancel')}</button></div>`);
 o.querySelector('#cx').onclick=()=>o.remove();
 o.querySelector('#sv').onclick=async e=>{
  const b=e.currentTarget;b.disabled=true;const row={};
  for(const f of fl(k)){const el=o.querySelector('#f_'+f[0]);let v=el.value;
   if(f[3]&&!v&&f[2]!='file'){b.disabled=false;return toast(t('req')+': '+p(f[1]))}
   if(f[2]=='file'){const file=el.files[0];if(!file)continue;
    const path=`${k}/${crypto.randomUUID()}_${file.name.replace(/[^\w.]/g,'_')}`;const u=await db.storage.from('docs').upload(path,file);
    if(u.error){b.disabled=false;return toast(u.error.message)}v=db.storage.from('docs').getPublicUrl(path).data.publicUrl}
   row[f[0]]=v===''?null:v}
  const{error}=r.id?await db.from(k).update(row).eq('id',r.id):await db.from(k).insert(row);
  if(error){b.disabled=false;return toast(error.code=='23505'?t('dup'):error.message)}
  o.remove();toast(t('saved'));await load(k);render();
 };
}

function history(id){
 const v=dv('vehicles').find(x=>x.id==id),by=k=>D[k].filter(x=>x.vehicle_id==id),sv=x=>esc(p(V[x]||x||''));
 const ul=(k,fn)=>`<ul>${by(k).map(x=>`<li>${fn(x)}</li>`).join('')||`<li>${t('none')}</li>`}</ul>`;
 const tot=sum(by('invoices'),'amount')+sum(by('incidents'),'repair_cost')+sum(by('fines'),'amount');
 modal(`<h3>${t('file')}: <span class="plate">${esc(v.plate)}</span> ${esc(v.model)}</h3><div class="kpis">${kpi('receipt',t('totalCost'),money(tot),'#dcf3ea','#0f8a64')}${kpi('gauge',t('odo'),v.odometer??'—','#e6eef5','#24506f')}</div><div class="hist">
 <h4>${t('hs')}</h4>${ul('handovers',x=>`${x.date} — ${sv(x.kind)} — ${esc(nm(['drivers','name'],x.driver_id))}`)}
 <h4>${p(S.incidents.t)}</h4>${ul('incidents',x=>`${x.date} — ${sv(x.status)} — ${money(x.repair_cost)}`)}
 <h4>${p(S.invoices.t)}</h4>${ul('invoices',x=>`${x.date} — ${esc(x.supplier)} (${sv(x.category)}) — ${money(x.amount)}`)}
 <h4>${p(S.fines.t)}</h4>${ul('fines',x=>`${x.date} — ${money(x.amount)} — ${sv(x.status)}`)}</div>`);
}

function report(){
 const m=window._m||new Date().toISOString().slice(0,7),s=stats(m);
 const rows=[['r_total',s.total],['r_work',s.work],['r_stop',s.stop],['r_out',s.out],['r_in',s.inn],['r_inc',s.inc],['r_incc',money(s.incCost)],['r_maint',money(s.maint)],['r_inv',money(s.inv)],['r_fines',`${s.fines} (${money(s.finesAmt)})`],['r_need',s.need],['r_util',s.util+'%']];
 const pv=dv('vehicles').map(v=>{const i=sum(inM(dv('invoices'),m).filter(x=>x.vehicle_id==v.id),'amount'),c=sum(inM(dv('incidents'),m).filter(x=>x.vehicle_id==v.id),'repair_cost'),f=sum(inM(dv('fines'),m).filter(x=>x.vehicle_id==v.id),'amount');return[v.plate,i,c,f,i+c+f]});
 shell(`<div class="top"><h2>${t('report')}</h2><input type="month" id="mm" value="${m}" style="width:170px" class="noprint"><button class="btn sig noprint" onclick="print()">${ic('print',16)}${t('print')}</button></div>
 <div class="box" style="margin-bottom:20px"><table><tbody>${rows.map(r=>`<tr><td>${t(r[0])}</td><td><b>${r[1]}</b></td></tr>`).join('')}</tbody></table></div>
 <div class="top"><h2 style="font-size:18px">${t('perCar')}</h2></div><div class="box"><table><thead><tr><th>${p(L.plate)}</th><th>${t('cInv')}</th><th>${t('cInc')}</th><th>${t('cFine')}</th><th>${t('cTot')}</th></tr></thead><tbody>${pv.map(r=>`<tr><td><span class="plate">${esc(r[0])}</span></td><td>${money(r[1])}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td><b>${money(r[4])}</b></td></tr>`).join('')}</tbody></table></div>`);
 $('#mm').onchange=e=>{window._m=e.target.value;report()};
}
function render(){if(page=='users'&&!isA())page='dash';page=='dash'?dash():page=='report'?report():page=='users'?users():list(page)}

async function users(){
 const{data}=await db.from('profiles').select('*').order('created_at');
 shell(`<div class="top"><h2>${t('users')}</h2><button class="btn sig" id="add">${ic('plus',16)}${t('add')}</button></div><div class="box"><table><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th>${p(L.city)}</th><th></th></tr></thead><tbody>${(data||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td dir="ltr">${esc(u.email)}</td><td><span class="b ${u.role=='admin'?'g':''}">${p(RL[u.role])}</span></td><td>${u.city?esc(p(V[u.city]||u.city)):'—'}</td><td>${u.email==prof.email?'':`<button class="btn red sm" data-u="${esc(u.email)}" title="${t('del')}">${ic('trash',15)}</button>`}</td></tr>`).join('')}</tbody></table></div>`);
 $('#add').onclick=uform;
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{if(!confirm(t('conf')))return;const{error}=await db.from('profiles').delete().eq('email',b.dataset.u);if(error)return toast(error.message);toast(t('deleted'));users()});
}
function uform(){
 const o=modal(`<h3>${t('add')} — ${t('users')}</h3><div class="fg">
 <div><label>${t('name')} *</label><input id="u_n"></div>
 <div><label>${t('role')} *</label><select id="u_r"><option value="supervisor">${p(RL.supervisor)}</option><option value="admin">${p(RL.admin)}</option></select></div>
 <div><label>${t('email')} *</label><input id="u_e" type="email" dir="ltr"></div>
 <div><label>${t('pass')} * (6+)</label><input id="u_p" type="text" dir="ltr" autocomplete="off"></div>
 <div class="w" id="u_cw"><label>${p(L.city)} *</label><select id="u_c"><option value="">${t('choose')}</option>${CITIES.map(c=>`<option value="${c.split('|')[0]}">${p(c)}</option>`).join('')}</select></div></div>
 <div class="ft"><button class="btn sig" id="sv">${t('save')}</button><button class="btn ghost" id="cx">${t('cancel')}</button></div>`);
 const q=id=>o.querySelector('#'+id);
 q('u_r').onchange=()=>q('u_cw').style.display=q('u_r').value=='admin'?'none':'';
 q('cx').onclick=()=>o.remove();
 q('sv').onclick=async e=>{const b=e.currentTarget,role=q('u_r').value,em=q('u_e').value.trim().toLowerCase(),pw=q('u_p').value;
  if(!q('u_n').value.trim()||!em||pw.length<6||(role=='supervisor'&&!q('u_c').value))return toast(t('req'));
  b.disabled=true;
  const{error}=await db.from('profiles').insert({email:em,full_name:q('u_n').value.trim(),role,city:role=='admin'?null:q('u_c').value});
  if(error){b.disabled=false;return toast(error.code=='23505'?t('dup'):error.message)}
  const tmp=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'tmp-signup'}});
  const r=await tmp.auth.signUp({email:em,password:pw});
  o.remove();toast(r.error?t('signupFail')+r.error.message:t('saved'));users();
 };
}
async function start(){
 const{data}=await db.from('profiles').select('*').eq('email',(user.email||'').toLowerCase());
 prof=(data||[])[0]||null;if(!prof)return noaccess();
 cityF='';page='dash';await loadAll();render();
}
function noaccess(){
 $('#root').innerHTML=`<div class="lf" style="min-height:100vh"><div style="text-align:center;max-width:380px"><h2>${t('noacc')}</h2><p>${t('noaccSub')}</p><button class="btn sig" id="lo2">${t('logout')}</button></div></div>`;
 $('#lo2').onclick=()=>db.auth.signOut();
}
function login(){
 $('#root').innerHTML=`<div class="lw"><div class="lb"><img class="lgbig" src="${LOGO}" alt="Anan Capital"><div><h1>${t('tag')}</h1><p>${t('tagSub')}</p></div><div></div></div>
 <div class="lf"><button class="btn ghost sm lg2" id="lg" type="button">${ic('globe',15)}${lang=='ar'?'English':'العربية'}</button>
 <form id="lf" autocomplete="on"><h2>${t('login')}</h2><p>${t('loginSub')}</p>
 <label for="em">${t('email')}</label><input id="em" name="email" type="email" autocomplete="username" dir="ltr" required>
 <label for="pw">${t('pass')}</label><input id="pw" name="password" type="password" autocomplete="current-password" dir="ltr" required>
 <button class="btn sig" id="go" type="submit" style="width:100%">${t('login')}</button></form></div></div>`;
 $('#lg').onclick=()=>setLang(lang=='ar'?'en':'ar');
 $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;
  const{error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  b.disabled=false;if(error)toast(t('bad'))};
}
db.auth.onAuthStateChange((ev,ses)=>{
 setTimeout(()=>{
  if(ses){if(user&&user.id==ses.user.id)return;user=ses.user;start()}
  else{user=null;prof=null;if(!$('#lf'))login()}
 },0)});
</script>
</body>
</html>
